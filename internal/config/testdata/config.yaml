logger:
  level: info
  output: stderr
baos:
  indication-handlers: 5
mqtt:
  host: 127.0.0.1:1883
  user: thermo-watchdog
  password: test-password
  ca-cert: /opt/local/etc/mosquitto/certs/cacert.pem
read-only:
  - pattern: datapoints/+
    ids: 1-4
updatable:
  - pattern: datapoints/+/set
    ids: 8-11
